const tests = [];
function test(name, fn) { tests.push({ name, fn }); }
function assertEqual(actual, expected) {
  if (JSON.stringify(actual) !== JSON.stringify(expected))
    throw new Error("expected " + JSON.stringify(expected) + " but got " + JSON.stringify(actual));
}
async function runTests() {
  let passed = 0, failed = 0;
  for (const t of tests) {
    try { await t.fn(); passed++; }
    catch (e) {
      failed++;
      const li = document.createElement("li");
      li.textContent = t.name + ": " + e.message;
      document.getElementById("failures").appendChild(li);
    }
  }
  const p = document.createElement("p");
  p.id = "summary";
  p.textContent = passed + " passed, " + failed + " failed";
  document.body.appendChild(p);
}

test("date picker: days before the earliest date are disabled, picking one sets the real input and closes", () => {
  const form = document.createElement("form");
  form.innerHTML = '<label for="dp">Date</label><input id="dp" type="date">';
  document.body.appendChild(form);
  const input = form.querySelector("input");
  let events = 0;
  input.addEventListener("input", () => events++);
  initDatePicker(input, "2026-11-10");
  const trigger = form.querySelector(".date-trigger");
  trigger.click();
  const day = iso => form.querySelector('[data-date="' + iso + '"]');
  assertEqual([day("2026-11-09").disabled, day("2026-11-10").disabled, trigger.getAttribute("aria-expanded")], [true, false, "true"]);
  form.querySelector('[aria-label="Next month"]').click(); // December, then January: the calendar must stay open
  form.querySelector('[aria-label="Next month"]').click();
  assertEqual([form.querySelector(".date-pop").hidden, form.querySelector(".date-title").textContent], [false, "January 2027"]);
  form.querySelector('[aria-label="Previous month"]').click();
  form.querySelector('[aria-label="Previous month"]').click();
  day("2026-11-12").click();
  assertEqual([input.value, events, form.querySelector(".date-pop").hidden, trigger.textContent.includes("Thursday, November 12, 2026")], ["2026-11-12", 1, true, true]);
  form.remove();
});

test("stepQty clamps 0 to 50 and fires input and change", () => {

  i.addEventListener("input", () => seen.push("input"));
  i.addEventListener("change", () => seen.push("change"));
  i.value = "0"; stepQty(i, -1);
  assertEqual(i.value, "0");
  i.value = "50"; stepQty(i, 1);
  assertEqual(i.value, "50");
  i.value = ""; stepQty(i, 1);
  assertEqual(i.value, "1");

});

const fakeStorage = (init = {}) => ({ data: { ...init }, getItem(k) { return k in this.data ? this.data[k] : null; },
  setItem(k, v) { this.data[k] = String(v); } });
const blockedStorage = { getItem() { throw new Error("blocked"); }, setItem() { throw new Error("blocked"); } };
test("saveCart then loadCart round-trips", () => {
  const s = fakeStorage();
  saveCart(s, { "ube-cake|8-inch": 2 });
  assertEqual(loadCart(s), { "ube-cake|8-inch": 2 });
});
test("loadCart is empty for nothing saved, bad JSON, bad quantities or blocked storage", () => {
  assertEqual(loadCart(fakeStorage()), {});
  assertEqual(loadCart(fakeStorage({ "annesweet-cart": "{oops" })), {});
  assertEqual(loadCart(fakeStorage({ "annesweet-cart": '{"a|x":0,"b|x":1.5,"c|x":51,"d|x":"2","e|x":3}' })), { "e|x": 3 });
  assertEqual(loadCart(blockedStorage), {});
  assertEqual(loadCart(null), {});
  saveCart(blockedStorage, { "a|x": 1 }); // must not throw
  saveCart(null, { "a|x": 1 });
});
test("cartCount adds up quantities", () => {

function formFixture(patch) {
  document.getElementById("form-fixture")?.remove();
  const v = Object.assign({ name: "Maria", contact: " 0917 123 4567 ", dateNeeded: earliestDate(new Date()) }, patch);
  const c = document.createElement("div");
  c.id = "form-fixture";
  c.innerHTML = '<form novalidate>' +
    ["name", "contact", "fbName", "occasion", "message", "flavor", "design", "address", "notes", "website"].map(n =>
      '<input id="' + n + '" name="' + n + '"><p class="error" id="err-' + n + '"></p>').join("") +
    '<input id="customSize" name="size"><p class="error" id="err-customSize"></p>' +
    '<input id="dateNeeded" name="dateNeeded" type="date"><p class="error" id="err-dateNeeded"></p>' +
    '<div id="order-lines"></div><p class="error" id="err-items"></p><p class="error" id="err-custom"></p>' +
    '<input type="radio" name="fulfillment" value="pickup" checked><p class="error" id="err-fulfillment"></p>' +
    '<button type="submit">Send</button></form>';
  document.body.appendChild(c);
  const f = c.firstChild;
  renderOrderLines([item("t", "cake")], f.querySelector("#order-lines"));
  Object.entries(v).forEach(([k, val]) => { f.elements[k].value = val; });
  f.querySelector('input[name="qty"]').value = "2";
  return f;
}

const fetchReturning = body => async () => ({ json: async () => body });
const withUrl = async fn => { APPS_SCRIPT_URL = "https://example.test/x"; try { await fn(); } finally { APPS_SCRIPT_URL = ""; } };
test("submitOrder ok on {ok:true}", () => withUrl(async () =>
  assertEqual((await submitOrder(ok, fetchReturning({ ok: true }))).ok, true)));
test("submitOrder not ok on {ok:false}, passing the server's error on", () => withUrl(async () =>
  assertEqual(await submitOrder(ok, fetchReturning({ ok: false, error: "x" })), { ok: false, error: "x" })));
test("submitOrder not ok on network error", () => withUrl(async () =>
  assertEqual((await submitOrder(ok, async () => { throw new Error("offline"); })).ok, false)));
test("submitOrder not ok on unparseable response", () => withUrl(async () =>
  assertEqual((await submitOrder(ok, async () => ({ json: async () => { throw new Error("bad"); } }))).ok, false)));
test("submitOrder sends an abort signal (timeout)", () => withUrl(async () => {
  let signal;
  await submitOrder(ok, async (u, opts) => { signal = opts.signal; return { json: async () => ({ ok: true }) }; });
  assertEqual(signal instanceof AbortSignal, true);
}));
test("submitOrder not ok and no fetch when APPS_SCRIPT_URL is empty", async () => {

  assertEqual(calls, 0);
});
